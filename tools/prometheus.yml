global:
  scrape_interval: 1s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9191"]
        labels:
          app_type: tools
          app_name: prometheus

  - job_name: "kaffah_finance_app"
    scrape_interval: 1s
    static_configs:
      - targets: ["host.docker.internal:3001"]
        labels:
          app_type: http_server
          app_name: kaffah_finance
