version: "3"

networks:
  kaffah_network:
    driver: bridge

services:
  zookeeper:
    image: zookeeper:3.9
    container_name: signoz-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
      - "2888:2888"
      - "3888:3888"
    environment:
      - ZOO_MY_ID=1
      - ZOO_4LW_COMMANDS_WHITELIST=*
    networks:
      - kaffah_network

  clickhouse:
    image: clickhouse/clickhouse-server:24.1.2-alpine
    container_name: signoz-clickhouse
    hostname: clickhouse
    ports:
      - "9000:9000"
      - "8123:8123"
      - "9181:9181"
    volumes:
      - ./clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/listen.xml
      - ./clickhouse/clickhouse-users.xml:/etc/clickhouse-server/users.d/users.xml
      - ./volumes/clickhouse/clickhouse-data:/var/lib/clickhouse
    networks:
      - kaffah_network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  query-service:
    image: signoz/query-service:0.45.0
    container_name: signoz-query-service
    hostname: signoz-query-service
    command: ["-config=/root/config/prometheus.yml"]
    ports:
      - "8080:8080"
    volumes:
      - ./prometheus.yml:/root/config/prometheus.yml
      - ./volumes/signoz_db:/var/lib/signoz
    environment:
      - ClickHouseUrl=tcp://clickhouse:9000
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
      - TELEMETRY_ENABLED=true
      - DEPLOYMENT_TYPE=docker-standalone-amd64
    restart: on-failure
    depends_on:
      - clickhouse
      - zookeeper
    networks:
      - kaffah_network

  frontend:
    image: signoz/frontend:0.45.0
    container_name: signoz-frontend
    hostname: frontend
    ports:
      - "3301:3301"
    volumes:
      - ./frontend-nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - query-service
    networks:
      - kaffah_network

  otel-collector:
    image: signoz/signoz-otel-collector:0.88.11
    container_name: signoz-otel-collector
    hostname: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    restart: always
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "5317:4317" # OTLP gRPC receiver (Mapped to 5317 to match .env)
      - "5318:4318" # OTLP HTTP receiver
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.description=linux
    depends_on:
      - clickhouse
      - query-service
    networks:
      - kaffah_network
